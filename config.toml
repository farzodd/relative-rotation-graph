# Single source of truth for the RRG run.
# Every value here is mirrored in the README config table. Change both together.

[universe]
benchmark = "SPY"
# The 11 SPDR select sector funds. XLRE (2015) and XLC (2018) are younger than
# the rest; with a 5y lookback both have ample history, but the validator will
# name them first if the lookback is ever widened.
symbols = [
    "XLB",   # Materials
    "XLC",   # Communication Services
    "XLE",   # Energy
    "XLF",   # Financials
    "XLI",   # Industrials
    "XLK",   # Technology
    "XLP",   # Consumer Staples
    "XLRE",  # Real Estate
    "XLU",   # Utilities
    "XLV",   # Health Care
    "XLY",   # Consumer Discretionary
    # Industry funds, narrower than the sectors above. Both are subsets of a
    # sector already in the list — ITA of Industrials, SMH of Technology — so
    # the peer group is no longer a partition. Under cross-sectional scoring a
    # sector and its own sub-industry are scored against each other, which
    # double-counts the theme. Absolute mode is unaffected: each is measured
    # against the benchmark alone.
    # Alternatives if preferred: XAR (equal-weight aerospace), SOXX (semis).
    "ITA",   # Aerospace & Defense
    "SMH",   # Semiconductors
]

[universe.labels]
XLB = "Materials"
XLC = "Comm Svcs"
XLE = "Energy"
XLF = "Financials"
XLI = "Industrials"
XLK = "Technology"
XLP = "Staples"
XLRE = "Real Estate"
XLU = "Utilities"
XLV = "Health Care"
XLY = "Discretionary"
ITA = "Aerospace & Def"
SMH = "Semiconductors"

[data]
# "tiingo" needs TIINGO_API_KEY in the environment. "yfinance" needs no key.
provider = "yfinance"
# Weekly bars, week ending Friday. Resampled from daily adjusted closes rather
# than requested as weekly, so the provider's week convention can't surprise us.
interval = "weekly"
week_anchor = "W-FRI"
lookback_years = 5
cache_dir = ".cache"
# Reuse cached daily closes younger than this instead of re-hitting the API.
cache_max_age_hours = 20

[method]
ema_short = 10
ema_long = 30
ema_momentum = 10


# "cross_sectional" scores each security against its peers on each date.
# "absolute"       divides by a constant, so position is measured against the
#                  benchmark rather than against peers.
# These are not comparable. Do not mix them across runs.
#
# Default is "absolute": the main view is "how is each member doing against the
# benchmark", with SPY on the origin. Profiles that want the peer-relative view
# set normalization explicitly rather than inheriting it.
normalization = "absolute"


# Absolute mode only. The axis unit is a `sigma_multiple`-sigma move of whichever
# member has the widest dispersion, so +-1.0 is the edge of that move and the
# axes read -1 to +1. Raising it zooms out.
#
# Because the divisor is one constant rather than a per-date statistic, the
# origin stays fixed at the benchmark: every member can sit in Lagging together,
# which cross-sectional scoring structurally cannot show. The constant is
# recomputed from the loaded history on each run, so it drifts slowly as data
# accumulates, and it is stamped on the chart so a change is visible.
sigma_multiple = 2.0

# Whose sigma sets the unit. 100 = the widest member, which lets a single
# volatile outlier (SMH is 2.31x the median member) set the divisor and squeeze
# everyone else into the centre. A lower percentile sizes the chart for a
# typical member and lets outliers run off-scale, where they are marked.
scale_percentile = 75.0

[chart]
tail_length = 12
output_dir = "output"

# Absolute mode only. A fixed frame rather than one that expands to whatever the
# widest tail reaches — otherwise a single outlier re-compresses everyone, and
# week-to-week charts stop being comparable. Members outside it are drawn at the
# boundary as hollow triangles with their true coordinate in the label.
frame_limit = 1.25

figure_width = 11.0
figure_height = 9.0
dpi = 160

# --------------------------------------------------------------------------
# Profiles
# --------------------------------------------------------------------------
# Named overrides of [method] and [chart]. Everything else — universe,
# benchmark, bar interval, data source — is shared.
#
# Two dimensions, spelled out in every name so a profile cannot mean something
# its name does not say:
#
#   abs_*   measured against the benchmark; the whole universe can lag at once
#   cross_* measured against the peer group; the universe re-centres every bar
#   *_balanced  EMA 10/30/10, tail 12
#   *_fast      EMA 5/15/5,  tail 8 — earlier crossings, roughly double the
#               reversal rate (30% vs 15%; see --all-profiles)
#
# abs_balanced repeats the default deliberately, so the list is complete and
# every view has a name.

[profiles.abs_balanced]
description = "Against the benchmark, moderate speed. Same as the default."
normalization = "absolute"
ema_short = 10
ema_long = 30
ema_momentum = 10
tail_length = 12

[profiles.abs_fast]
description = "Against the benchmark, reacts earlier at the cost of more false crossings."
normalization = "absolute"
ema_short = 5
ema_long = 15
ema_momentum = 5
tail_length = 8

[profiles.cross_balanced]
description = "Against the peer group, moderate speed."
normalization = "cross_sectional"
ema_short = 10
ema_long = 30
ema_momentum = 10
tail_length = 12

[profiles.cross_fast]
description = "Against the peer group, reacts earlier at the cost of more false crossings."
normalization = "cross_sectional"
ema_short = 5
ema_long = 15
ema_momentum = 5
tail_length = 8

# --------------------------------------------------------------------------
# Report
# --------------------------------------------------------------------------

# Recipients, sender, and the unsubscribe group are read from the environment,
# never from this file — it is committed to a public repository and addresses
# belong to people. See the reporting section of the README for the variables.

[report]
# One section per profile, reviewed independently. Each section gets its own
# chart, position table, and list of what moved — the two views disagree, and
# the disagreements are the interesting part.
profiles = ["abs_balanced", "abs_fast"]
subject = "Sector RRG — week ending {as_of}"
output_dir = "output"

# "What changed" is measured against the last report actually delivered, not the
# last one rendered, so a dry run does not consume the comparison.
state_dir = ".state"

