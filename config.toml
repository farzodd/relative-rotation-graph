# Single source of truth for the RRG run.
# Every value here is mirrored in the README config table. Change both together.

[universe]
benchmark = "SPY"
# The 11 SPDR select sector funds. XLRE (2015) and XLC (2018) are younger than
# the rest; with a 5y lookback both have ample history, but the validator will
# name them first if the lookback is ever widened.
symbols = [
    "XLB",   # Materials
    "XLC",   # Communication Services
    "XLE",   # Energy
    "XLF",   # Financials
    "XLI",   # Industrials
    "XLK",   # Technology
    "XLP",   # Consumer Staples
    "XLRE",  # Real Estate
    "XLU",   # Utilities
    "XLV",   # Health Care
    "XLY",   # Consumer Discretionary
    # Industry funds, narrower than the sectors above. Both are subsets of a
    # sector already in the list — ITA of Industrials, SMH of Technology — so
    # the peer group is no longer a partition. Under cross-sectional scoring a
    # sector and its own sub-industry are scored against each other, which
    # double-counts the theme. Absolute mode is unaffected: each is measured
    # against the benchmark alone.
    # Alternatives if preferred: XAR (equal-weight aerospace), SOXX (semis).
    "ITA",   # Aerospace & Defense
    "SMH",   # Semiconductors
]

[universe.labels]
XLB = "Materials"
XLC = "Comm Svcs"
XLE = "Energy"
XLF = "Financials"
XLI = "Industrials"
XLK = "Technology"
XLP = "Staples"
XLRE = "Real Estate"
XLU = "Utilities"
XLV = "Health Care"
XLY = "Discretionary"
ITA = "Aerospace & Def"
SMH = "Semiconductors"

[data]
# "tiingo" needs TIINGO_API_KEY in the environment. "yfinance" needs no key.
provider = "yfinance"
# Weekly bars, week ending Friday. Resampled from daily adjusted closes rather
# than requested as weekly, so the provider's week convention can't surprise us.
interval = "weekly"
week_anchor = "W-FRI"
lookback_years = 5
cache_dir = ".cache"
# Reuse cached daily closes younger than this instead of re-hitting the API.
cache_max_age_hours = 20

[method]
ema_short = 10
ema_long = 30
ema_momentum = 10

# "cross_sectional" scores each security against its peers on each date.
# "time_series"    scores each security against its own history.
# "absolute"       divides by a constant, so position is measured against the
#                  benchmark rather than against peers.
# These are not comparable. Do not mix them across runs.
normalization = "cross_sectional"

# Only used when normalization = "time_series". Ignored otherwise.
zscore_window = 60

# Absolute mode only. The axis unit is a `sigma_multiple`-sigma move of whichever
# member has the widest dispersion, so +-1.0 is the edge of that move and the
# axes read -1 to +1. Raising it zooms out.
#
# Because the divisor is one constant rather than a per-date statistic, the
# origin stays fixed at the benchmark: every member can sit in Lagging together,
# which cross-sectional scoring structurally cannot show. The constant is
# recomputed from the loaded history on each run, so it drifts slowly as data
# accumulates, and it is stamped on the chart so a change is visible.
sigma_multiple = 2.0

# Whose sigma sets the unit. 100 = the widest member, which lets a single
# volatile outlier (SMH is 2.31x the median member) set the divisor and squeeze
# everyone else into the centre. A lower percentile sizes the chart for a
# typical member and lets outliers run off-scale, where they are marked.
scale_percentile = 75.0

[chart]
tail_length = 12
output_dir = "output"

# Absolute mode only. A fixed frame rather than one that expands to whatever the
# widest tail reaches — otherwise a single outlier re-compresses everyone, and
# week-to-week charts stop being comparable. Members outside it are drawn at the
# boundary as hollow triangles with their true coordinate in the label.
frame_limit = 1.25

# "linear" keeps distance proportional to movement, so tail length and rotation
# angle mean what they look like.
# "asinh" is linear near the origin and logarithmic further out: it un-compresses
# the clustered middle while still fitting large moves on screen. The cost is
# that distances and angles are no longer proportional — a straight move renders
# curved, and tail lengths are not comparable between the middle and the edge.
axis_scale = "linear"
# Width of the asinh transform's linear region, in axis units.
asinh_linear_width = 0.35
figure_width = 11.0
figure_height = 9.0
dpi = 160

# --------------------------------------------------------------------------
# Profiles
# --------------------------------------------------------------------------
# Named overrides of [method] and [chart]. Everything else — universe,
# benchmark, bar interval, data source — is shared, so the three views are
# genuinely the same data seen at different speeds and stay comparable.
#
# The tradeoff they span is responsiveness against stability. A shorter EMA
# pair crosses quadrant boundaries earlier and more often; some of those extra
# crossings are real rotations caught early and some are noise, and no setting
# separates the two in advance. Compare them on the diagnostics table, not on
# which chart looks tidier.

[profiles.fast]
description = "Quadrant-entry optimised: crosses early, at the cost of more false crossings."
ema_short = 5
ema_long = 15
ema_momentum = 5
tail_length = 8

[profiles.balanced]
description = "Middle ground. The original settings this project was specified with."
ema_short = 10
ema_long = 30
ema_momentum = 10
tail_length = 12

# Same speed as `balanced`, different question. The three profiles above ask
# "which member is rotating where relative to the others"; this one asks "is any
# of them beating the benchmark at all". Its coordinates are not comparable with
# the others' — only with its own history.
[profiles.absolute]
description = "Measured against the benchmark, not against peers. Everything can lag at once."
normalization = "absolute"
ema_short = 10
ema_long = 30
ema_momentum = 10
tail_length = 12

# Same numbers as `absolute`, drawn on a non-linear axis: linear near the origin,
# logarithmic further out. Un-compresses the cluster near the benchmark at the
# cost of proportionality — distances and rotation angles are no longer to scale.
[profiles.absolute_asinh]
description = "Absolute, asinh axes: expands the centre, distorts distances."
normalization = "absolute"
axis_scale = "asinh"
ema_short = 10
ema_long = 30
ema_momentum = 10
tail_length = 12

# Absolute basis at the fast profile's speed. The reactive view: is anything
# beating the benchmark, answered as early as the data allows.
[profiles.absolute_fast]
description = "Absolute basis, fast EMAs. Earliest read on whether anything is beating the benchmark."
normalization = "absolute"
ema_short = 5
ema_long = 15
ema_momentum = 5
tail_length = 8
