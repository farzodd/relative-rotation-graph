[project]
name = "relative-rotation-graph"
version = "0.1.0"
description = "Relative Rotation Graph (RRG) for a universe of securities against a benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "requests>=2.31",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rrg = "rrg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rrg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
